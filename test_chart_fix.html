<!DOCTYPE html>
<html>
<head>
    <title>Chart Fix Test</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Chart Bounds Test</h1>
    <canvas id="testChart" width="400" height="200"></canvas>
    
    <script>
        const ctx = document.getElementById('testChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Test Data',
                    data: [],
                    borderColor: 'rgb(75, 192, 192)',
                    backgroundColor: 'rgba(75, 192, 192, 0.1)',
                    borderWidth: 2,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        min: 0.0,
                        max: 2.0,
                        beginAtZero: true
                    }
                }
            }
        });
        
        // Test with some sample data
        setTimeout(() => {
            chart.data.labels = ['0', '1', '2', '3', '4'];
            chart.data.datasets[0].data = [1.0, 1.1, 0.9, 1.05, 0.95];
            chart.update();
        }, 1000);
        
        // Test with extreme data (should be clamped)
        setTimeout(() => {
            chart.data.labels = ['0', '1', '2', '3', '4', '5', '6'];
            chart.data.datasets[0].data = [1.0, 1.1, 0.9, 1.05, 0.95, 15.0, -5.0]; // Extreme values
            chart.update();
        }, 3000);
    </script>
</body>
</html>
